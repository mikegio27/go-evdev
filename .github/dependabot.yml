# Dependabot: weekly version updates plus security updates (alerts and
# automated security fixes are enabled in the repo settings).
#
# - cooldown 7 days matches the 7-day minimum-release-age policy: a release has
#   to survive a week before a version-update PR is opened. Security updates
#   ignore the cooldown.
# - minor and patch bumps are grouped into one PR per ecosystem; majors stay
#   separate so breaking changes get their own review.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
